name: 구글 평점 채우기 (Google Places)

# Actions 시크릿 GOOGLE_MAPS_API_KEY 로 scripts/google_places.py 를 실행해
# 구글 평점·리뷰 수·구글 예약 표시·영업 상태를 data/restaurants.json 에 채우고,
# 산출물(지도 데이터·CSV·문서)을 다시 만든 뒤 main 에 커밋합니다.
# Actions 탭 → "구글 평점 채우기" → Run workflow 로 수동 실행.

on:
  workflow_dispatch:
    inputs:
      only_missing:
        description: "구글 평점이 비어 있는 가게만 조회"
        type: boolean
        default: false
      dry_run:
        description: "파일을 바꾸지 않고 로그로 결과만 보기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: google-places
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google Places 조회
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ONLY_MISSING: ${{ inputs.only_missing }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          args=()
          [ "$ONLY_MISSING" = "true" ] && args+=(--only-missing)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 scripts/google_places.py "${args[@]}" | tee google_places.log

      - name: 산출물 다시 만들기
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/build.py | tee -a google_places.log

      - name: 변경 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs exports README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "구글 평점·리뷰 수 갱신 (Google Places API)"
          git push

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-places-log
          path: google_places.log
          if-no-files-found: ignore
