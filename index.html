<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>간사이 레전드 맛집 지도 · 오사카 교토 고베 나라</title>
  <meta name="description" content="오사카·교토·고베·나라 레전드 맛집 DB와 지도 (타베로그·미쉐린·유튜브·구글지도 기반)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.Default.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <header class="head">
        <h1>🍜 간사이 레전드 맛집</h1>
        <p class="sub" id="sub">오사카 · 교토 · 고베 · 나라</p>
      </header>

      <div class="filters">
        <input id="q" class="search" type="search" placeholder="가게·메뉴·지역 검색 (예: 라멘, 난바, 551)" autocomplete="off">
        <div class="chips" id="regionChips" role="group" aria-label="지역"></div>
        <div class="chips scroll" id="areaChips" role="group" aria-label="세부 지역" hidden></div>
        <div class="chips scroll" id="catChips" role="group" aria-label="카테고리"></div>
        <div class="chips" id="bookChips" role="group" aria-label="예약 방식"></div>
        <div class="row">
          <div class="chips" id="levelChips" role="group" aria-label="등급"></div>
          <div class="chips" id="priceChips" role="group" aria-label="가격"></div>
        </div>
        <div class="row">
          <button class="chip toggle" id="favOnly" aria-pressed="false">♥ 찜만</button>
          <button class="chip toggle" id="hideVisited" aria-pressed="false">✓ 방문한 곳 숨기기</button>
          <button class="chip" id="locate">📍 내 위치순</button>
          <button class="chip" id="reset">초기화</button>
        </div>
      </div>

      <div class="countbar">
        <div class="count" id="count"></div>
        <select id="sort" class="sort" aria-label="정렬">
          <option value="level">추천순 (내 위치 켜면 가까운순)</option>
          <option value="tabelog">타베로그 점수순</option>
          <option value="grating">구글 평점순</option>
          <option value="google">구글 리뷰 많은순</option>
        </select>
      </div>
      <ol class="list" id="list"></ol>

      <footer class="foot">
        영업시간·휴무는 자주 바뀝니다. 방문 전 구글 지도/타베로그에서 다시 확인하세요.<br>
        <span id="gen"></span> · <a href="https://github.com/tkdrn416/matzip">GitHub</a>
      </footer>
    </aside>

    <main class="mapwrap">
      <div id="map" aria-label="맛집 지도"></div>
    </main>
  </div>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="data/restaurants.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
