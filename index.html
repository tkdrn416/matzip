<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>간사이 레전드 맛집 지도 · 오사카 교토 고베 나라</title>
  <meta name="description" content="오사카·교토·고베·나라 레전드 맛집 DB와 지도 (타베로그 점수·미쉐린·노포 기준, 온라인 예약·웨이팅·영업시간)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.Default.css">
  <link rel="stylesheet" href="assets/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="assets/style.css">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="맛집">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <header class="head">
        <h1>🍜 간사이 레전드 맛집</h1>
        <p class="sub" id="sub">오사카 · 교토 · 고베 · 나라</p>
        <p class="modenote2"><a href="list.html">📋 목록 모드로 보기</a> · <button id="mapSettings" class="linkbtn" type="button">⚙️ 지도 설정</button></p>
      </header>

      <div class="filters">
        <input id="q" class="search" type="search" placeholder="가게·메뉴·지역 검색 (예: 라멘, 난바, 551)" autocomplete="off">
        <div class="chips" id="regionChips" role="group" aria-label="지역"></div>
        <div class="chips scroll" id="areaChips" role="group" aria-label="세부 지역" hidden></div>
        <div class="row quick">
          <button class="chip toggle" id="openNow" aria-pressed="false">🟢 지금 영업 중</button>
          <button class="chip toggle" id="noSmoke" aria-pressed="false">🚭 금연·분연만</button>
          <button class="chip toggle" id="easyWait" aria-pressed="false">🧘 한적·웨이팅 없음</button>
          <button class="chip" id="locate">📍 내 위치순</button>
          <button class="chip more" id="moreFilters">필터 더보기 ▾</button>
        </div>
        <div class="secondary">
          <div class="chips scroll" id="catChips" role="group" aria-label="카테고리"></div>
          <div class="chips" id="bookChips" role="group" aria-label="예약 방식"></div>
          <div class="row">
            <div class="chips" id="levelChips" role="group" aria-label="등급"></div>
            <div class="chips" id="priceChips" role="group" aria-label="가격"></div>
          </div>
          <div class="row">
            <button class="chip toggle" id="favOnly" aria-pressed="false">♥ 찜만</button>
            <button class="chip" id="favRoute" hidden>🗺 찜한 곳 구글맵 경로</button>
            <button class="chip" id="favShare" hidden>📤 찜 목록 공유</button>
            <button class="chip toggle" id="hideVisited" aria-pressed="false">✓ 방문한 곳 숨기기</button>
            <button class="chip" id="reset">초기화</button>
          </div>
        </div>
      </div>

      <div class="countbar">
        <div class="count" id="count"></div>
        <select id="sort" class="sort" aria-label="정렬">
          <option value="level">추천순</option>
          <option value="tabelog">타베로그 점수순</option>
          <option value="quiet">한적한 순</option>
          <option value="grating">구글 평점순</option>
          <option value="google">구글 리뷰 많은순</option>
        </select>
      </div>
      <ol class="list" id="list"></ol>

      <footer class="foot">
        영업시간·휴무는 자주 바뀝니다. 방문 전 구글 지도/타베로그에서 다시 확인하세요.<br>
        <span id="gen"></span> · <a href="https://github.com/tkdrn416/matzip">GitHub</a>
      </footer>
    </aside>

    <main class="mapwrap">
      <div id="map" aria-label="맛집 지도"></div>
      <div id="pcard" class="pcard" hidden></div>
    </main>
  </div>

  <div id="viewSeg" class="viewseg" role="group" aria-label="보기 전환"><button type="button" data-view="map" aria-pressed="false">🗺 지도</button><button type="button" data-view="list" aria-pressed="false">📋 목록</button></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="setDlg" class="dlg">
    <h3>⚙️ 지도 설정</h3>
    <p class="cnote">구글 지도(한국어)로 보려면 <b>브라우저용 Google Maps 키</b>를 넣으세요. 키는 이 기기에만 저장됩니다.
      키는 Google Cloud 에서 <b>Map Tiles API</b>를 켜고, 웹사이트 제한을 <code>https://tkdrn416.github.io/*</code> 로 건 키여야 해요.</p>
    <label class="cform1">브라우저용 키 <input type="text" id="gkeyInput" autocomplete="off" spellcheck="false" placeholder="AIza…"></label>
    <p id="gkeyStatus" class="cnote"></p>
    <div class="dlgbtns"><button id="gkeySave" class="cta">저장</button><button id="setClose">닫기</button></div>
  </dialog>

  <dialog id="dlg" class="dlg">
    <h3 id="dlgTitle"></h3>
    <div id="dlgExtra"></div>
    <textarea id="dlgText" rows="9" readonly></textarea>
    <div class="dlgbtns"><button id="dlgCopy" class="cta">복사</button><button id="dlgClose">닫기</button></div>
  </dialog>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="assets/vendor/maplibre/maplibre-gl.js"></script>
  <script src="assets/vendor/maplibre/leaflet-maplibre-gl.js"></script>
  <script src="data/restaurants.js"></script>
  <script src="assets/config.js" onerror="void 0"></script>
  <script src="assets/app.js"></script>
  <script>
    // 오프라인 지원(https 에서만). 아티팩트·로컬 파일에선 건너뜀
    if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
